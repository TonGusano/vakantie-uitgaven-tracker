<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vakantie Uitgaven Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Vakantie Uitgaven Tracker</h1>
  </header>

  <main>
    <section id="settings" class="card">
      <h2>Instellingen</h2>
      <div class="field-row">
        <label for="start-date">Startdatum</label>
        <input type="date" id="start-date" />
      </div>
      <div class="field-row">
        <label for="num-days">Aantal dagen</label>
        <input type="number" id="num-days" min="1" max="60" />
      </div>

      <h3>Budget per categorie (&euro;)</h3>
      <div class="budget-grid" id="budget-inputs"></div>

      <h3>Vaste kosten, al betaald (&euro;)</h3>
      <div class="budget-grid" id="fixed-cost-inputs"></div>
    </section>

    <section id="totals" class="card">
      <h2>Totaaloverzicht</h2>
      <div id="category-totals"></div>
      <div id="fixed-costs-total"></div>
      <div id="grand-total"></div>
    </section>

    <section id="daily" class="card">
      <h2>Dagoverzicht</h2>
      <div id="day-list"></div>
    </section>
  </main>

  <p id="storage-warning" class="warning" hidden>
    Let op: je apparaat blokkeert lokale opslag. Wijzigingen worden niet bewaard na het sluiten van deze pagina.
  </p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
